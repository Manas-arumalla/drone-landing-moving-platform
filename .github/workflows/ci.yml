name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System dependencies (MuJoCo headless rendering)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libosmesa6

      - name: Install package with runtime and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[vision,mpc,rl,viz,dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        env:
          MUJOCO_GL: egl
        run: pytest -q
